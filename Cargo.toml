[workspace]
resolver = "2"
members = [
    "rust_frp_core",
    "rust_frp_server",
    "rust_frp_client",
    "rust_frp_config",
    "rust_frp_plugin",
    "rust_frp_auth",
    "rust_frp_net",
    "rust_frp_util"
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
log = "0.4"
tokio-tungstenite = "0.24"
futures-util = "0.3"
rand = "0.8"
glob = "0.3"
hostname = "0.3"
ring = "0.17"
snap = "1"
base64 = "0.22"
axum = "0.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "auth"] }
# QUIC-only TLS 配置：显式关闭默认 features（默认会拉入 aws-lc-rs，引入 C 编译依赖），
# 改用 ring 后端；与 quinn 的 rustls-ring 保持同一 provider，避免 rustls
# “多 provider”运行时 panic。现有 TCP/TLS 走 tokio-rustls 0.25（rustls 0.22+ring），
# 与本实例互不影响。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = "0.25"
rustls-pemfile = "2.0"
urlencoding = "2.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
kcp = "0.6"
yamux = "0.13"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio-util = { version = "0.7", features = ["compat"] }
notify = { version = "6.0", default-features = false, features = ["macos_kqueue"] }


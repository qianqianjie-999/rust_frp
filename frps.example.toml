# =============================================================================
# frps 示例配置（frps.example.toml）
#
# 用法：
#   cp frps.example.toml frps.toml
#   然后按需修改。frps.toml 已被 .gitignore 忽略，不会进入版本库。
#
# 说明：所有 "CHANGE_ME_*" 占位符都必须替换为真实值，切勿直接上线。
# =============================================================================

# --- 基础监听（必须写在任何 [table] 之前） ---
bind_addr = "0.0.0.0"
bind_port = 9300

# 工作连接端口（默认 bind_port + 1000）
# work_conn_port = 10300

# 虚拟主机端口
vhost_http_port = 9090
vhost_https_port = 9091

# tcpmux：HTTP CONNECT 复用端口（多个 tcpmux 代理共享此端口）
# 未配置时，服务端会拒绝注册 tcpmux 代理（fail-closed）
tcpmux_http_connect_port = 7777

# KCP 协议监听端口（UDP）
# kcp_bind_port = 7001

# QUIC 协议监听端口（UDP）。QUIC 强制 TLS 1.3，适合弱网；
# 客户端 protocol = "quic" 时必需；控制连接与工作连接复用同一 QUIC 连接上的多条双向流。
quic_bind_port = 7002

# --- 端口白名单（为空即拒绝所有 TCP 代理端口，显式允许更安全） ---
allow_ports = [
    { single = 9302 },
    { single = 9303 },
    { single = 9304 },
    { single = 9305 },
    { start = 10000, end = 20000 },
]

# --- 自定义域名白名单（HTTP/HTTPS/tcpmux 代理的 custom_domains） ---
# 客户端提交的 custom_domains 决定 vhost 的 Host 匹配项。留空 = 只校验域名语法、
# 不限制归属（任何已认证客户端都能注册任意域名抢占 Host 匹配）；
# 填了 = 客户端注册的域名必须落在白名单内，否则该代理注册失败。
# 匹配：精确条目只放行自身；"*.example.com" 放行其子域（含客户端注册的同名通配）。
# custom_domains_allowlist = ["app.example.com", "*.corp.example.com"]

# --- 服务端 HTTP 插件（可选，默认不启用） ---
# frps 在登录 / 代理注册 / 关闭代理 / 心跳 / 工作连接 / 用户连接等事件时，
# POST 到插件地址：{addr}{path}?version=0.1.0&op={Op}，请求体为
# {"version":"0.1.0","op":"Op","content":{...}}，并带 X-Frp-Reqid 头。
# 插件返回 {"reject":bool,"reject_reason":"","unchange":bool,"content":{...}}：
#   reject = true  → 拒绝该操作（reject_reason 回传客户端）
#   unchange = false → 用 content 覆写（Login 可注入 metas，NewProxy 可改配置）
# ops 合法值：Login / NewProxy / CloseProxy / Ping / NewWorkConn / NewUserConn
# https 地址默认不校验证书；需要校验证书时设置 tls_verify = true。
#
# [[http_plugins]]
# name = "user-manager"
# addr = "http://127.0.0.1:9000"
# path = "/handler"
# ops = ["Login", "NewProxy", "CloseProxy", "Ping", "NewWorkConn", "NewUserConn"]

# --- Web Dashboard（默认禁用：port = 0） ---
# ⚠️ 只要 port != 0，user 与 password 就必须成对配置且非空——不配会**拒绝启动**。
#    原因：无凭据时鉴权中间件不挂载，dashboard 全部页面连同有副作用的
#    POST /api/reload 会对任何能访问该端口的人开放。
# 生产环境建议只监听 127.0.0.1，并前置 Nginx 提供 HTTPS。
# [web_server]
# addr = "127.0.0.1"
# port = 7500
# user = "CHANGE_ME_DASHBOARD_USER"
# password = "CHANGE_ME_STRONG_DASHBOARD_PASSWORD"
# 是否公开 Prometheus 抓取端点 /metrics（默认 false，返回 404）
# 注意：开启后 /metrics 免登录可读（含 run_id、代理名、流量计数），
# 建议同时用反向代理限制来源；Dashboard 内的 /api/metrics 始终受登录保护。
# expose_metrics = false

# --- 传输配置 ---
[transport]
protocol = "tcp"
tcp_mux = true
pool_count = 10
# 非法的带宽值（空串 / 0 / 负数 / 非数字）会直接报配置错误
# bandwidth_limit = "10MB"

# --- 日志配置（对齐原版 frp `[log]` 段） ---
# 不配置 → 只输出到 stderr（systemd 由 journald 收集）；
# 配置 to 之后 → stderr 与文件**同时**输出，按天轮转为 `<文件名>.<YYYY-MM-DD>`
# （日期与日志行时间戳均按**本地时区**，如 `2026-10-05T12:29:28.427312+08:00`），
# 并自动清理超过 maxDays 天的旧文件。想强制时区就给进程设 TZ（如 TZ=Asia/Shanghai）。
# 也可用旧版 INI 风格的顶层 `log_level` / `log_file` / `log_max_days`，
# 两者同时存在时以 `[log]` 段为准。
# [log]
# to = "/var/log/frps.log"
# level = "info"        # 也接受 RUST_LOG 风格过滤表达式
# maxDays = 3           # 0 = 不自动清理

# 启用 TLS：请务必指定自建证书，否则会在启动时内存中生成自签证书（仅加密、不认证身份）
# [transport.tls]
# enable = true
# cert_file = "/etc/frp/certs/server.crt"
# key_file = "/etc/frp/certs/server.key"
# tls_only = true
#
# ── 可选：mTLS（客户端证书双向认证）──
# 配置 client_ca_file 后，服务端会在握手阶段校验客户端证书链。与 token 是"叠加"
# 关系：mTLS 决定"谁连得上"，token 决定"连上后能做什么"。
# client_ca_file = "/etc/frp/certs/ca.crt"   # 用于校验客户端证书的 CA
# require_client_cert = false                # false（默认）：未出示也放行（灰度期）
#                                            # true：必须出示且校验通过，否则握手失败
# 灰度顺序：服务端先配 client_ca_file（require = false）→ 下发客户端证书 → 再改 true。
# ⚠️ 没有"跳过链校验"的开关：一旦配置即严格验链，require = false 只放宽"是否允许不出示"。

# --- 认证配置（二选一） ---
# 方式一：Token（推荐）
[auth]
method = "token"
token = "CHANGE_ME_RANDOM_LONG_TOKEN"

# ── 控制口加固（2026-10-05 安全加固）─────────────────────────────
# client_id 是服务端判定"同一客户端重连（应踢掉旧会话）"的依据。
# 若客户端未配 client_id 而退化成**空**或**等于主机名**，两台同名主机会被
# 判为同一客户端而无限互踢（2026-10-05 线上事故：1735 次互踢、端口掉线 3 分钟）。
#   "warn"   —— 只记 WARN 放行（默认，兼容旧客户端）
#   "reject" —— 硬拒登录，让问题在客户端配置阶段就暴露
# 注意：**客户端必须先配好唯一 client_id 再切 reject**，否则会被拒在门外。
client_id_policy = "warn"

# 登录失败节流：同一 client_id 连续失败 N 次后锁定 M 秒（成功即清零）。
# 以 client_id 为主维度（动态 IP + NAT 下纯按 IP 会误伤）。0 = 关闭节流。
login_max_failures = 5
login_lockout_secs = 600

# 会话接管是否要求新旧连接**证书指纹一致**（需与 mTLS 同用才有意义）。
# true 时，攻击者即便拿到 token 并猜到 client_id，没有对应私钥也顶不掉合法客户端。
# 灰度期（客户端尚未出示证书）会自动退回按 client_id 判定，不影响断线重连。
# kick_require_same_cert = true

# 方式二：OIDC（服务端只做「验签」：拉取 issuer 的 discovery + JWKS 校验客户端令牌）
# [auth]
# method = "oidc"
# [auth.oidc]
# issuer = "https://your-oidc-provider.com"   # 必填：发现文档与 JWKS 的入口
# audience = "frp-server"                      # 为空时跳过 aud 校验
# skipExpiryCheck = false                      # true 则跳过 exp 校验
# skipIssuerCheck = false                      # true 则跳过 iss 校验
# # 若 IdP 使用私有 CA / 自签证书：
# trustedCaFile = "/etc/ssl/idp-ca.pem"
# # 仅调试用：跳过证书校验（会失去中间人防护）
# insecureSkipVerify = false
# # 请求令牌时申请的授权范围（客户端角色使用，服务端忽略）
# scope = "openid profile"

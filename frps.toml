# 服务器基本配置
bind_addr = "0.0.0.0"
bind_port = 7000

# Web 服务器配置
[web_server]
addr = "0.0.0.0"
port = 7500
user = "admin"
password = "admin"
tls = { enable = false }

# 认证配置
[auth]
method = "token"
token = "test_token"

# 传输配置
[transport]
protocol = "tcp"
tls = { enable = true }
tcp_mux = true
pool_count = 10

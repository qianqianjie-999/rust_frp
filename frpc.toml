# ============================================
# rust_frp 客户端配置文件
# ============================================

# 服务器连接配置
server_addr = "123.57.86.80"
server_port = 9300

# 认证配置
[auth]
method = "token"
token = "your_secure_token"

# 传输配置
[transport]
protocol = "tcp"
tls = { enable = true }

# ============================================
# 代理配置
# ============================================

# HTTP 代理示例
[[proxies]]
name = "http_web"
type = "http"
local_ip = "127.0.0.1"
local_port = 8080
custom_domains = ["web.example.com"]

# TCP 代理示例
[[proxies]]
name = "tcp_ssh"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 22
remote_port = 9302

# HTTPS 代理示例
[[proxies]]
name = "https_web"
type = "https"
local_ip = "127.0.0.1"
local_port = 8443
custom_domains = ["secure.example.com"]

# ============================================
# rust_frp 客户端配置文件
# ============================================
#
# 本配置文件展示了所有支持的功能和配置选项
# 请根据实际需求取消注释并修改相应配置
#

# ============================================
# 基础配置
# ============================================

# 服务器连接配置
server_addr = "127.0.0.1"
server_port = 9300

# 可选：多用户场景的用户名
# user = "user1"

# 可选：多客户端场景的客户端 ID
# client_id = "client_001"

# ============================================
# 认证配置
# ============================================

[auth]
# 认证方法: "token" 或 "oidc"
method = "token"

# 令牌认证（当 method = "token" 时使用）
token = "your_secure_token"

# OIDC 认证配置（当 method = "oidc" 时使用）
# 以下是完整的企业身份提供商配置示例
# [auth.oidc]
# issuer = "https://auth.example.com"
# audience = "frp-service"
# client_id = "frp-client-id"
# client_secret = "frp-client-secret"
# token_endpoint_url = "https://auth.example.com/oauth/token"

# ============================================
# 传输配置
# ============================================

[transport]
# 传输协议: "tcp", "kcp", "quic", "websocket"
# 默认: "tcp"
protocol = "tcp"

# TLS 配置
# TLS 默认已启用（enable = true）
# 客户端会自动信任服务器的内置自签名证书
tls = { enable = true }

# TLS 配置完整示例：
# 1. 跳过证书验证（适用于自定义自签名证书场景）
# tls = { enable = true, skip_verify = true }
# 2. 使用自定义 CA 证书验证服务器证书
# tls = { enable = true, trusted_ca_file = "/path/to/ca.crt" }
# 3. 使用自定义证书和私钥
# tls = { enable = true, cert_file = "/path/to/cert.pem", key_file = "/path/to/key.pem" }

# 启用 TCP 多路复用
# 多个业务流共享单个 TCP 连接，减少握手延迟
# 默认: true
tcp_mux = true

# 连接池大小
# 客户端预建立的工作连接数量，建议值：5-100
# 默认: 10
pool_count = 10

# 全局带宽限制（可选）
# 格式: "1MB"、"500KB"、"10GB"、"1GB"
# 默认: 无限制
# bandwidth_limit = "10MB"

# ============================================
# 代理配置
# ============================================

# -------------------- TCP 代理 --------------------
# 最基本的代理类型，将本地端口映射到服务器端口
[[proxies]]
name = "tcp_ssh"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 22
remote_port = 9302

# -------------------- UDP 代理 --------------------
# 用于 UDP 服务（如 DNS、游戏服务器等）
# [[proxies]]
# name = "udp_game"
# type = "udp"
# local_ip = "127.0.0.1"
# local_port = 27015
# remote_port = 9303

# -------------------- HTTP 代理 --------------------
# 用于 Web 服务，支持虚拟主机和路径路由
# [[proxies]]
# name = "http_web"
# type = "http"
# local_ip = "127.0.0.1"
# local_port = 80
# custom_domains = ["web.example.com"]
# 可选配置：
# subdomain = "www"                    # 子域名（配合服务器 subdomain_base 使用）
# locations = ["/api", "/static"]      # URL 路径匹配规则
# host_header_rewrite = "example.com"   # 改写 Host header
# http_user = "admin"                  # HTTP 基本认证用户名
# http_password = "password"           # HTTP 基本认证密码

# -------------------- HTTPS 代理 --------------------
# 用于安全的 Web 服务
# [[proxies]]
# name = "https_web"
# type = "https"
# local_ip = "127.0.0.1"
# local_port = 443
# custom_domains = ["secure.example.com"]
# 可选：使用插件处理 SSL 证书
# [proxies.plugin]
# type = "https2http"
# local_addr = "127.0.0.1:8080"
# crt_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"

# -------------------- WebSocket 代理 --------------------
# 用于通过 WebSocket 协议穿透防火墙
# [[proxies]]
# name = "websocket_app"
# type = "tcp"
# local_ip = "127.0.0.1"
# local_port = 8080
# remote_port = 9304
# transport = { protocol = "websocket" }

# -------------------- STCP 代理（Secret TCP）--------------------
# 基于密钥访问的 TCP 代理，需要访问者配置密钥
# 服务器端配置：
# [[proxies]]
# name = "stcp_internal"
# type = "stcp"
# local_ip = "127.0.0.1"
# local_port = 3389
# secret_key = "your_secret_key"
# 可选：带宽限制
# bandwidth_limit = "5MB"

# -------------------- XTCP 代理（P2P）--------------------
# 点对点穿透，适用于 NAT 穿透场景
# [[proxies]]
# name = "xtcp_p2p"
# type = "xtcp"
# local_ip = "127.0.0.1"
# local_port = 22
# secret_key = "p2p_secret_key"

# -------------------- 插件代理 --------------------
# 使用插件扩展代理功能

# 1. Unix Domain Socket 插件
# [[proxies]]
# name = "unix_docker"
# type = "tcp"
# local_ip = "127.0.0.1"
# local_port = 0
# remote_port = 9305
# [proxies.plugin]
# type = "unix_domain_socket"
# unix_path = "/var/run/docker.sock"

# 2. 静态文件服务器插件
# [[proxies]]
# name = "static_files"
# type = "http"
# local_ip = "127.0.0.1"
# local_port = 0
# custom_domains = ["files.example.com"]
# [proxies.plugin]
# type = "static_file"
# local_path = "/var/www/html"
# strip_prefix = "/files"

# 3. HTTP 代理插件
# [[proxies]]
# name = "http_proxy"
# type = "tcp"
# local_ip = "127.0.0.1"
# local_port = 0
# remote_port = 9306
# [proxies.plugin]
# type = "http_proxy"
# http_user = "proxy_user"
# http_password = "proxy_pass"

# 4. SOCKS5 代理插件
# [[proxies]]
# name = "socks5_proxy"
# type = "tcp"
# local_ip = "127.0.0.1"
# local_port = 0
# remote_port = 9307
# [proxies.plugin]
# type = "socks5"

# -------------------- 健康检查 --------------------
# 自动检查本地服务可用性，不健康时自动剔除
# [[proxies]]
# name = "tcp_with_health"
# type = "tcp"
# local_ip = "127.0.0.1"
# local_port = 8080
# remote_port = 9308
# [proxies.health_check]
# type = "tcp"                      # 检查类型: "tcp" 或 "http"
# timeout_seconds = 3               # 超时时间（秒）
# max_failed = 3                    # 连续失败次数阈值
# interval_seconds = 10              # 检查间隔（秒）
# path = "/health"                  # HTTP 检查路径（仅 http 类型）

# ============================================
# 访问者配置（用于访问其他客户端的 STCP/XTCP 服务）
# ============================================

# 访问 STCP 代理
# [[visitors]]
# name = "visit_stcp"
# type = "stcp"
# server_name = "stcp_internal"       # 被访问的代理名称（需与对方配置匹配）
# secret_key = "your_secret_key"     # 访问密钥（需与对方配置匹配）
# bind_addr = "127.0.0.1"
# bind_port = 9000                   # 本地监听端口，访问此端口即可连接远程服务

# 访问 XTCP 代理
# [[visitors]]
# name = "visit_xtcp"
# type = "xtcp"
# server_name = "xtcp_p2p"           # 被访问的代理名称
# secret_key = "p2p_secret_key"      # 访问密钥
# bind_addr = "127.0.0.1"
# bind_port = 9001

# ============================================
# 配置文件包含（可选）
# ============================================

# 支持通过 glob 模式包含其他配置文件
# includes = ["/etc/frp.d/*.toml"]

# ============================================
# 配置示例说明
# ============================================

# 1. TCP 代理：最基本的代理类型
#    - 适用场景：SSH、远程桌面、游戏服务器等
#    - 配置要点：指定 local_ip, local_port, remote_port

# 2. UDP 代理：用于 UDP 协议服务
#    - 适用场景：DNS、游戏服务器、视频流等
#    - 配置要点：type = "udp"

# 3. HTTP/HTTPS 代理：用于 Web 服务
#    - 适用场景：网站、移动端 API、内部管理系统等
#    - 配置要点：custom_domains 指定域名，支持虚拟主机

# 4. WebSocket 代理：用于复杂网络环境
#    - 适用场景：企业防火墙、代理限制严格的环境
#    - 配置要点：transport = { protocol = "websocket" }

# 5. STCP/XTCP 代理：安全内网穿透
#    - 适用场景：访问内网数据库、Windows 远程桌面等
#    - 配置要点：需要双方都配置 secret_key

# 6. 带宽限制：控制流量
#    - 适用场景：多用户共享带宽、限制特定服务流量
#    - 配置要点：bandwidth_limit = "10MB"

# 7. 健康检查：自动故障转移
#    - 适用场景：微服务、多实例部署
#    - 配置要点：配置 health_check 自动检查

# 8. 插件扩展：扩展代理功能
#    - 适用场景：Unix socket 转发、静态文件服务、SOCKS5 等
#    - 配置要点：使用 plugin 配置替代 local_ip/local_port

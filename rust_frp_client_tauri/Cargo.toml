[package]
name = "rust_frp_client_tauri"
version = "0.1.0"
edition = "2021"
description = "rust_frp 客户端 Tauri 图形界面（托盘 + 网页控制台，Win7-Win11）"
default-run = "rust_frpc-gui"

[[bin]]
name = "rust_frpc-gui"
path = "src/main.rs"

[dependencies]
# custom-protocol 必须启用：tauri::is_dev() = !cfg!(feature = "custom-protocol")。
# 没有它，即便 cargo build --release 编出的 exe 也会认为自己是 dev 模式，
# 去连 build.devUrl（http://localhost:1420）而不是内嵌的 frontend 资源，
# 窗口显示「localhost 拒绝连接」。官方 tauri build 会自动带这个 feature，
# 我们用裸 cargo 编译，必须显式开。
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-log = "0.2"
rust_frp_client = { path = "../rust_frp_client" }
rust_frp_config = { path = "../rust_frp_config" }
rust_frp_util = { path = "../rust_frp_util" }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2" }

[profile.release]
opt-level = 2

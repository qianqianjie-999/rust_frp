[package]
name = "rust_frp_server_tauri"
version = "0.2.3"
edition = "2021"
description = "rust_frp 服务端 Tauri 图形界面（托盘 + 网页控制台，Win7-Win11）"
default-run = "rust_frps-gui"

[[bin]]
name = "rust_frps-gui"
path = "src/main.rs"

[dependencies]
# custom-protocol 必须启用：裸 cargo build 时 exe 才会内嵌 frontend 资源，
# 否则 dev 模式去连 http://localhost:1420，窗口显示「localhost 拒绝连接」。
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-log = "0.2"
rust_frp_server = { path = "../rust_frp_server" }
rust_frp_config = { path = "../rust_frp_config" }
rust_frp_util = { path = "../rust_frp_util" }
notify = { workspace = true }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2" }

[profile.release]
opt-level = 2

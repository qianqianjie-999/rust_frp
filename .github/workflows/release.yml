name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        # .cargo/config.toml 把该 target 的 linker 指定为绝对路径 /usr/bin/musl-gcc，
        # 未安装 musl-tools 时 cc-rs 会报 ToolNotFound（v0.2.2 发布实测踩到）。
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: >
          cargo build --release
          --target ${{ matrix.target }}
          -p rust_frp_server -p rust_frp_client
          --bin rust_frps --bin rust_frpc

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          case "${{ matrix.target }}" in
            *windows*) suffix=".exe" ;;
          esac
          staging="dist/rust_frp-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/rust_frps${suffix}" "$staging/"
          cp "target/${{ matrix.target }}/release/rust_frpc${suffix}" "$staging/"
          cp frps.example.toml frpc.example.toml "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          # 平台安装方法直接入包: Windows=安装/看门狗脚本+指南, Linux/macOS=systemd/launchd 文档
          if [ -n "$suffix" ]; then
            cp deploy/windows/install.bat deploy/windows/uninstall.bat \
               deploy/windows/update.bat deploy/windows/run.cmd \
               deploy/windows/frpc.windows.example.toml "$staging/"
            cp docs/windows-client.md "$staging/INSTALL-windows.md"
          else
            cp deploy/INSTALL-linux-frps.md deploy/INSTALL-linux-frpc.md "$staging/"
          fi
          tar -czf "rust_frp-${{ matrix.target }}.tar.gz" -C dist "rust_frp-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_frp-${{ matrix.target }}
          path: rust_frp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Make deploy kit (安装方法套件, 单独资产)
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          kit="rust_frp-${GITHUB_REF_NAME}-deploy-kit"
          mkdir -p "$kit/windows" "$kit/linux"
          cp deploy/windows/install.bat deploy/windows/uninstall.bat \
             deploy/windows/update.bat deploy/windows/run.cmd \
             deploy/windows/frpc.windows.example.toml "$kit/windows/"
          cp docs/windows-client.md "$kit/windows/INSTALL-windows.md"
          cp deploy/INSTALL-linux-frps.md deploy/INSTALL-linux-frpc.md "$kit/linux/"
          cp README.md "$kit/README.md"
          zip -qr "$kit.zip" "$kit"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            rust_frp-*-deploy-kit.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

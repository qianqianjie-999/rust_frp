name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build (glibc)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: rust_frps-glibc
          path: target/release/rust_frps

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: rust_frpc-glibc
          path: target/release/rust_frpc

  build-static:
    name: Build (static musl)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Build static release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify static linking
        run: |
          file target/x86_64-unknown-linux-musl/release/rust_frps | grep -q "statically linked" || exit 1
          file target/x86_64-unknown-linux-musl/release/rust_frpc | grep -q "statically linked" || exit 1

      - name: Upload server binary (static)
        uses: actions/upload-artifact@v4
        with:
          name: rust_frps-static
          path: target/x86_64-unknown-linux-musl/release/rust_frps

      - name: Upload client binary (static)
        uses: actions/upload-artifact@v4
        with:
          name: rust_frpc-static
          path: target/x86_64-unknown-linux-musl/release/rust_frpc

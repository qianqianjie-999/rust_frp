name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # 依赖漏洞扫描（RustSec 数据库）；continue-on-error 避免数据库误报阻塞主流程，
    # 但告警仍会显示在 PR 检查中
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build (glibc)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: rust_frps-glibc
          path: target/release/rust_frps

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: rust_frpc-glibc
          path: target/release/rust_frpc

  build-static:
    name: Build (static musl)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Build static release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify static linking
        run: |
          # 判据修正（2026-10-05）：musl 产物 PIE 化后 `file` 输出为 "static-pie linked"，
          # 原判据只认 "statically linked" ⇒ 永远匹配不上、永久假红（实测确认）。
          # 现改为「措辞兼容 + 实质校验」双轨：
          #   1) file 接受两种措辞（快速失败，给出可读原因）
          #   2) readelf 断言无 DT_NEEDED —— 这才是"换机即跑"的真正判据
          for bin in rust_frps rust_frpc; do
            f="target/x86_64-unknown-linux-musl/release/$bin"
            [ -f "$f" ] || { echo "ERROR: 缺少产物 $f"; exit 1; }
            if ! file "$f" | grep -qE "statically linked|static-pie linked"; then
              echo "ERROR: $bin 非静态链接：$(file "$f")"
              exit 1
            fi
            if readelf -d "$f" 2>/dev/null | grep -q "(NEEDED)"; then
              echo "ERROR: $bin 含 DT_NEEDED 动态依赖，换机可能报 GLIBC not found："
              readelf -d "$f" | grep "(NEEDED)"
              exit 1
            fi
            echo "$bin: static OK（无 DT_NEEDED）"
          done

      - name: Upload server binary (static)
        uses: actions/upload-artifact@v4
        with:
          name: rust_frps-static
          path: target/x86_64-unknown-linux-musl/release/rust_frps

      - name: Upload client binary (static)
        uses: actions/upload-artifact@v4
        with:
          name: rust_frpc-static
          path: target/x86_64-unknown-linux-musl/release/rust_frpc

# =============================================================================
# frpc 示例配置（frpc.example.toml）
#
# 用法：
#   cp frpc.example.toml frpc.toml
#   然后按需修改。frpc.toml 已被 .gitignore 忽略，不会进入版本库。
#
# 说明：所有 "CHANGE_ME_*" 占位符都必须替换为真实值，切勿直接上线。
# =============================================================================

# --- 服务器连接 ---
server_addr = "127.0.0.1"
server_port = 9300

# --- 认证配置（需与 frps 一致） ---
[auth]
method = "token"
token = "CHANGE_ME_RANDOM_LONG_TOKEN"

# --- 管理端口（frpc reload / frpc status 子命令依赖此项，默认禁用） ---
# [webServer]
# addr = "127.0.0.1"   # 建议仅监听本地
# port = 7400
# user = "admin"       # user/password 成对配置后启用 Basic 认证
# password = "CHANGE_ME_STRONG_PASSWORD"

# --- 传输配置 ---
[transport]
protocol = "tcp"
tcp_mux = true
pool_count = 10
# 全局带宽限制（代理级 bandwidth_limit 优先）
# bandwidth_limit = "10MB"

# 启用 TLS
[transport.tls]
enable = true
# 证书校验为 fail-closed 设计：既不配 trusted_ca_file 又不显式开 skip_verify 时，客户端拒绝启动。
# ⚠️ 生产环境：配置 trusted_ca_file（推荐），用 CA 证书验证服务端身份，防中间人攻击。
# trusted_ca_file = "/etc/frp/certs/ca.crt"
# ⚠️ 仅限自签名测试环境：显式跳过证书验证（只加密、不认证，打印 WARN）。
# skip_verify = true

# --- 代理定义 ---

# HTTP 代理
[[proxies]]
name = "http_web"
type = "http"
local_ip = "127.0.0.1"
local_port = 8080
custom_domains = ["web.example.com"]

# TCP 代理（带代理级带宽限制）
[[proxies]]
name = "tcp_ssh"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 22
remote_port = 9302
bandwidth_limit = "1MB"

# 应用层加密代理（use_encryption）：工作连接流量 AES-256-GCM 加密，
# 密钥由 token 派生；适合未开 TLS 或 KCP 传输场景。只加密不认证，
# 防被动嗅探不防中间人；已启用 TLS 时无需重复开启。
[[proxies]]
name = "tcp_encrypted"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 5432
remote_port = 9303
use_encryption = true

# 应用层压缩示例：压缩与加密可叠加（顺序固定为「先压缩、后加密」）。
# 也可用原版写法放在 [[proxies.transport]] 子表里，两种写法等价：
#   [proxies.transport]
#   useCompression = true
[[proxies]]
name = "tcp_compressed"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 5432
remote_port = 9304
use_compression = true

# 带健康检查的 TCP 代理
[[proxies]]
name = "tcp_app"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 8080
remote_port = 9305

# 健康检查是单个内联表（[[proxies]] 的子表），不要写成 [[proxies.health_check]]
[proxies.health_check]
type = "tcp"
interval_seconds = 10
timeout_seconds = 3
max_failed = 3

# =============================================================================
# tcpmux：HTTP CONNECT 复用（服务器需配置 tcpmux_http_connect_port，见 frps.example.toml）
# 多个内网服务共享服务器同一个端口，访问端用 HTTP CONNECT 指定目标域名：
#   curl -x http://<frps>:7777 http://mux.example.com/
# =============================================================================
[[proxies]]
name = "tcpmux_ssh"
type = "tcpmux"
local_ip = "127.0.0.1"
local_port = 22
custom_domains = ["mux.example.com"]
multiplexer = "httpconnect"       # 缺省即 httpconnect，目前仅支持该值
# 可选：要求访问端提供 HTTP Basic 凭据（缺失或不符返回 407）
# http_user = "alice"
# http_password = "CHANGE_ME_CONNECT_PASSWORD"
# 可选：同一域名下按 HTTP 用户区分多个 tcpmux 代理
# route_by_http_user = "alice"

# =============================================================================
# sudp：安全 UDP（经 STCP 隧道承载 UDP 报文，不在服务端开放 UDP 端口）
# 鉴权规则与 stcp 一致：secret_key 签名 + 120s 防重放，未配置则拒绝访问。
# 访问端配置见文件末尾的 [[visitors]]。
# =============================================================================
[[proxies]]
name = "sudp_dns"
type = "sudp"
local_ip = "127.0.0.1"
local_port = 53
secret_key = "CHANGE_ME_SHARED_SECRET"

# =============================================================================
# 访问者（visitors）：访问其他 frpc 暴露的 stcp / xtcp / sudp 服务
# =============================================================================
[[visitors]]
name = "visit_dns"
type = "sudp"
server_name = "sudp_dns"          # 与对方客户端的 proxy name 一致
secret_key = "CHANGE_ME_SHARED_SECRET"
bind_addr = "127.0.0.1"
bind_port = 5353                  # 本地 UDP 端口：dig @127.0.0.1 -p 5353 example.com

# =============================================================================
# frpc 示例配置（frpc.example.toml）
#
# 用法：
#   cp frpc.example.toml frpc.toml
#   然后按需修改。frpc.toml 已被 .gitignore 忽略，不会进入版本库。
#
# 说明：所有 "CHANGE_ME_*" 占位符都必须替换为真实值，切勿直接上线。
# =============================================================================

# --- 服务器连接 ---
server_addr = "127.0.0.1"
server_port = 9300

# --- 客户端身份（可选） ---
# 多台主机部署时**建议显式配置互不相同**的 client_id：服务端会把"同 client_id 的新登录"
# 判为同一客户端重连，踢掉旧会话并等其释放端口。未配置时客户端会随机生成一个，并在进程
# 生命周期（含配置热重载）内保持不变。
# client_id = "cli-<主机>-<用途>"

# --- 认证配置（需与 frps 一致） ---
[auth]
method = "token"
token = "CHANGE_ME_RANDOM_LONG_TOKEN"

# --- 认证方式一之备选：tokenSource（动态取 token，避免明文写配置）---
# 与上面的 token 互斥：二者只能配一个。解析在客户端启动与配置重载时进行，
# 结果只存入内存（不落盘），并供登录、工作连接签名与应用层加密统一使用。
# [auth.tokenSource]
# type = "file"
# filePath = "/run/secrets/frp_token"
# # 或执行命令、取 stdout：
# # type = "exec"
# # exec = ["/usr/local/bin/get-frp-token", "--env", "prod"]

# --- 认证方式二：OIDC（客户端以 client_credentials 向 IdP 换取 access_token）---
# 登录时把 access_token 作为凭据发给 frps，由 frps 用 issuer 的 JWKS 验签。
# [auth]
# method = "oidc"
# [auth.oidc]
# clientID = "your-client-id"
# clientSecret = "CHANGE_ME_OIDC_CLIENT_SECRET"
# tokenEndpointURL = "https://your-oidc-provider.com/token"
# audience = "frp-server"        # 可选：作为端点参数一并发送
# scope = "openid profile"       # 可选
# # additionalEndpointParams 里的键会作为额外表单参数发送：
# [auth.oidc.additionalEndpointParams]
# resource = "https://api.example.com"

# --- 管理端口（frpc reload / frpc status 子命令依赖此项，默认禁用） ---
# [webServer]
# addr = "127.0.0.1"   # 建议仅监听本地
# port = 7400
# user = "admin"       # user/password 成对配置后启用 Basic 认证
# password = "CHANGE_ME_STRONG_PASSWORD"

# --- 日志配置（对齐原版 frp `[log]` 段） ---
# 不配置 → 只输出到 stderr（systemd 由 journald 收集）；
# 配置 to 之后 → stderr 与文件**同时**输出，按天轮转为 `<文件名>.<YYYY-MM-DD>`
# （日期与日志行时间戳均按**本地时区**，如 `2026-10-05T12:29:28.427312+08:00`），
# 并自动清理超过 maxDays 天的旧文件。想强制时区就给进程设 TZ（如 TZ=Asia/Shanghai）。
# 也可用旧版 INI 风格的顶层 `log_level` / `log_file` / `log_max_days`，
# 两者同时存在时以 `[log]` 段为准。
# [log]
# to = "/var/log/frpc.log"
# level = "info"        # 也接受 RUST_LOG 风格过滤表达式
# maxDays = 3           # 0 = 不自动清理

# --- 传输配置 ---
[transport]
protocol = "tcp"
# ── 可选：改用 WebSocket / WSS（仅放行 HTTP 的网关、企业代理后推荐）──
# 把上面一行改为 protocol = "websocket"（明文 WebSocket）或 protocol = "wss"
# （TLS + WebSocket）。服务端无需任何额外配置：它在控制端口按 `GET /~!frp`
# 前缀自动识别 WebSocket 升级（TLS 场景在握手完成后于解密流上嗅探）。
#   * "websocket"：是否叠加 TLS 仍由 [transport.tls] 决定（enable = true 即叠加）
#   * "wss"：强制 TLS，和 quic 一样必须声明信任来源，否则启动即报错：
#       - 推荐：transport.tls.trusted_ca_file = "/etc/frp/certs/ca.crt"
#       - 或：  transport.tls.skip_verify = true（只加密不认证，仅限测试/自签名环境）
# ── 可选：改用 QUIC（弱网推荐）──
# 把上面一行改为 protocol = "quic" 即启用。QUIC 强制 TLS 1.3、无明文模式，
# 因此必须显式声明信任来源，否则启动即报错（与 TLS 一致的 fail-closed）：
#   * 推荐：transport.tls.trusted_ca_file = "/etc/frp/certs/ca.crt"（CA 验签，可认证身份）
#   * 或：  transport.tls.skip_verify = true（只加密不认证，仅限测试/自签名环境）
# 控制连接与工作连接复用同一 QUIC 连接上的多条双向流，省去重复握手。
# [transport.quic]
# max_idle_timeout = 30        # 秒，0 = 禁用空闲超时
# max_incoming_streams = 100000
# keepalive_period = 0         # 秒，0 = 不主动保活
tcp_mux = true
pool_count = 10
# 全局带宽限制（代理级 bandwidth_limit 优先）
# bandwidth_limit = "10MB"
# ── 可选：线协议版本（对齐原版 transport.wireProtocol）──
# 默认 "v1"（[4B 长度][JSON] 明文控制通道）。改为 "v2" 后启用：
#   魔数 FRP\x00\x02\r\n → 帧化 ClientHello/ServerHello 能力协商
#   → 以 HKDF 从 SHA-256(token) 派生的方向性 AEAD（aes-256-gcm）加密控制通道。
# 服务端无需配置（按魔数自动嗅探）；v1 客户端与服务端行为零变更。
# 要求 auth.method = "token"；当前作用于控制连接（工作连接仍走 v1）。
# wire_protocol = "v2"

# 启用 TLS
[transport.tls]
enable = true
# 证书校验为 fail-closed 设计：既不配 trusted_ca_file 又不显式开 skip_verify 时，客户端拒绝启动。
# ⚠️ 生产环境：配置 trusted_ca_file（推荐），用 CA 证书验证服务端身份，防中间人攻击。
# trusted_ca_file = "/etc/frp/certs/ca.crt"
#   ↳ 前提：服务端已配 cert_file/key_file（稳定证书），且证书 SAN 必须匹配 server_addr
#     （连 IP 就要有 IP SAN，连域名就要有该域名 SAN）。服务端未配证书时用的是
#     **内置运行时自签证书**（每次重启重生成、SAN 仅 frp-server.local/localhost），
#     此时 trusted_ca_file 无法固定它，只能让服务端换证书或改用下面的 skip_verify。
# ⚠️ 仅限自签名测试环境：显式跳过证书验证（只加密、不认证，打印 WARN）。
# skip_verify = true
#
# ── 可选：mTLS（客户端证书，出示给服务端校验）──
# 在客户端，cert_file/key_file 表示"客户端证书"，需与服务端 client_ca_file 配套。
# 必须与 trusted_ca_file 同时配置（两个方向都要认证）；与 skip_verify 互斥，
# 同时出现会被配置校验直接拒绝（给出示证书却不校验服务端 = 把身份递给冒充者）。
# cert_file = "/etc/frp/certs/client.crt"
# key_file  = "/etc/frp/certs/client.key"

# --- 代理定义 ---

# HTTP 代理
[[proxies]]
name = "http_web"
type = "http"
local_ip = "127.0.0.1"
local_port = 8080
custom_domains = ["web.example.com"]

# TCP 代理（带代理级带宽限制）
[[proxies]]
name = "tcp_ssh"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 22
remote_port = 9302
bandwidth_limit = "1MB"

# 应用层加密代理（use_encryption）：工作连接流量 AES-256-GCM 加密，
# 密钥由 token 派生；适合未开 TLS 或 KCP 传输场景。只加密不认证，
# 防被动嗅探不防中间人；已启用 TLS 时无需重复开启。
[[proxies]]
name = "tcp_encrypted"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 5432
remote_port = 9303
use_encryption = true

# 应用层压缩示例：压缩与加密可叠加（顺序固定为「先压缩、后加密」）。
# 也可用原版写法放在 [[proxies.transport]] 子表里，两种写法等价：
#   [proxies.transport]
#   useCompression = true
[[proxies]]
name = "tcp_compressed"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 5432
remote_port = 9304
use_compression = true

# 带健康检查的 TCP 代理
[[proxies]]
name = "tcp_app"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 8080
remote_port = 9305

# 健康检查是单个内联表（[[proxies]] 的子表），不要写成 [[proxies.health_check]]
[proxies.health_check]
type = "tcp"
interval_seconds = 10
timeout_seconds = 3
max_failed = 3

# =============================================================================
# tcpmux：HTTP CONNECT 复用（服务器需配置 tcpmux_http_connect_port，见 frps.example.toml）
# 多个内网服务共享服务器同一个端口，访问端用 HTTP CONNECT 指定目标域名：
#   curl -x http://<frps>:7777 http://mux.example.com/
# =============================================================================
[[proxies]]
name = "tcpmux_ssh"
type = "tcpmux"
local_ip = "127.0.0.1"
local_port = 22
custom_domains = ["mux.example.com"]
multiplexer = "httpconnect"       # 缺省即 httpconnect，目前仅支持该值
# 可选：要求访问端提供 HTTP Basic 凭据（缺失或不符返回 407）
# http_user = "alice"
# http_password = "CHANGE_ME_CONNECT_PASSWORD"
# 可选：同一域名下按 HTTP 用户区分多个 tcpmux 代理
# route_by_http_user = "alice"

# =============================================================================
# sudp：安全 UDP（经 STCP 隧道承载 UDP 报文，不在服务端开放 UDP 端口）
# 鉴权规则与 stcp 一致：secret_key 签名 + 120s 防重放，未配置则拒绝访问。
# 访问端配置见文件末尾的 [[visitors]]。
# =============================================================================
[[proxies]]
name = "sudp_dns"
type = "sudp"
local_ip = "127.0.0.1"
local_port = 53
secret_key = "CHANGE_ME_SHARED_SECRET"

# =============================================================================
# 访问者（visitors）：访问其他 frpc 暴露的 stcp / xtcp / sudp 服务
# =============================================================================
[[visitors]]
name = "visit_dns"
type = "sudp"
server_name = "sudp_dns"          # 与对方客户端的 proxy name 一致
secret_key = "CHANGE_ME_SHARED_SECRET"
bind_addr = "127.0.0.1"
bind_port = 5353                  # 本地 UDP 端口：dig @127.0.0.1 -p 5353 example.com


# =============================================================================
# 客户端插件（[proxies.plugin]）：由 frpc 在本地处理访问者连接，不占用工作连接。
# 示例：socks5 代理；配置 username/password 后按 RFC 1929 强制认证（未配置则无认证）。
# http_proxy 插件改用 http_user/http_password，校验 Proxy-Authorization，失败返回 407。
# =============================================================================
# [[proxies]]
# name = "local-socks5"
# type = "tcp"
# remote_port = 6001
# [proxies.plugin]
# type = "socks5"
# username = "alice"
# password = "CHANGE_ME_SOCKS5"

# =============================================================================
# frpc 示例配置（frpc.example.toml）
#
# 用法：
#   cp frpc.example.toml frpc.toml
#   然后按需修改。frpc.toml 已被 .gitignore 忽略，不会进入版本库。
#
# 说明：所有 "CHANGE_ME_*" 占位符都必须替换为真实值，切勿直接上线。
# =============================================================================

# --- 服务器连接 ---
server_addr = "127.0.0.1"
server_port = 9300

# --- 认证配置（需与 frps 一致） ---
[auth]
method = "token"
token = "CHANGE_ME_RANDOM_LONG_TOKEN"

# --- 传输配置 ---
[transport]
protocol = "tcp"
tcp_mux = true
pool_count = 10
# 全局带宽限制（代理级 bandwidth_limit 优先）
# bandwidth_limit = "10MB"

# 启用 TLS
[transport.tls]
enable = true
# 证书校验为 fail-closed 设计：既不配 trusted_ca_file 又不显式开 skip_verify 时，客户端拒绝启动。
# ⚠️ 生产环境：配置 trusted_ca_file（推荐），用 CA 证书验证服务端身份，防中间人攻击。
# trusted_ca_file = "/etc/frp/certs/ca.crt"
# ⚠️ 仅限自签名测试环境：显式跳过证书验证（只加密、不认证，打印 WARN）。
# skip_verify = true

# --- 代理定义 ---

# HTTP 代理
[[proxies]]
name = "http_web"
type = "http"
local_ip = "127.0.0.1"
local_port = 8080
custom_domains = ["web.example.com"]

# TCP 代理（带代理级带宽限制）
[[proxies]]
name = "tcp_ssh"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 22
remote_port = 9302
bandwidth_limit = "1MB"

# 带健康检查的 TCP 代理
[[proxies]]
name = "tcp_app"
type = "tcp"
local_ip = "127.0.0.1"
local_port = 8080
remote_port = 9303

# 健康检查是单个内联表（[[proxies]] 的子表），不要写成 [[proxies.health_check]]
[proxies.health_check]
type = "tcp"
interval_seconds = 10
timeout_seconds = 3
max_failed = 3

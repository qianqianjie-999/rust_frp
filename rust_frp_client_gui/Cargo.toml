[package]
name = "rust_frp_client_gui"
version = "0.1.0"
edition = "2021"
description = "rust_frp Windows GUI 客户端（egui 窗口 + 系统托盘，参数表单配置，进程内运行 visitor）"

[[bin]]
name = "rust_frpc-gui"
path = "src/main.rs"

[dependencies]
egui = "0.31"
# 只要 glow + 默认字体：Windows 单平台交付，不拉 x11/wayland/accesskit
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.19"
# 注册表 API 直读写（开机自启），复用 winit 依赖树里的 windows-sys 0.52
windows-sys = { version = "0.52", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
log = { workspace = true }
rust_frp_client = { path = "../rust_frp_client" }
rust_frp_config = { path = "../rust_frp_config" }
rust_frp_util = { path = "../rust_frp_util" }

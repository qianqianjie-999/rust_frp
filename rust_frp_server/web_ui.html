<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRP Server Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #1E293B;
            --cta: #22C55E;
            --background: #020617;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --glow: 0 0 20px rgba(34, 197, 94, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #22C55E, #16A34A);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
            font-size: 24px;
            font-weight: 700;
            color: white;
            box-shadow: var(--glow);
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #F8FAFC, #CBD5E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            font-size: 14px;
            color: #22C55E;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #22C55E;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: var(--glow);
        }

        .metric-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .metric-icon {
            width: 40px;
            height: 40px;
            background: rgba(34, 197, 94, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .metric-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 40px;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
            color: var(--text);
            text-shadow: 0 0 30px rgba(248, 250, 252, 0.3);
        }

        .card {
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            color: var(--text);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            transition: background 0.2s ease;
        }

        tr:hover td {
            background: rgba(34, 197, 94, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-tcp {
            background: rgba(59, 130, 246, 0.15);
            color: #60A5FA;
        }

        .type-http {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
        }

        .type-https {
            background: rgba(168, 85, 247, 0.15);
            color: #A78BFA;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            header h1 {
                font-size: 20px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .metric-value {
                font-size: 32px;
            }

            .card {
                padding: 16px;
            }

            th, td {
                padding: 10px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">F</div>
            <h1>FRP 服务器控制面板</h1>
            <div class="status-badge">在线</div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">👥</span>
                    <span class="metric-label">客户端</span>
                </div>
                <div class="metric-value" id="client-count">0</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">🔄</span>
                    <span class="metric-label">代理</span>
                </div>
                <div class="metric-value" id="proxy-count">0</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">🌐</span>
                    <span class="metric-label">访问者</span>
                </div>
                <div class="metric-value" id="visitor-count">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">已连接客户端</div>
                    <div class="card-subtitle">活跃的客户端连接</div>
                </div>
            </div>
            <div class="table-container">
                <table id="clients-table">
                    <thead>
                        <tr>
                            <th>客户端 ID</th>
                            <th>运行 ID</th>
                            <th>连接时间</th>
                            <th>最后心跳</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" class="empty-state">
                                <p>等待客户端连接...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <div class="card-title">活跃代理</div>
                    <div class="card-subtitle">已配置的代理服务</div>
                </div>
            </div>
            <div class="table-container">
                <table id="proxies-table">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>类型</th>
                            <th>本地地址</th>
                            <th>远程地址</th>
                            <th>客户端</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="empty-state">
                                <p>暂无配置的代理</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const [metricsResponse, controllersResponse, proxiesResponse] = await Promise.all([
                    fetch('/api/metrics'),
                    fetch('/api/controllers'),
                    fetch('/api/proxies')
                ]);

                const metrics = await metricsResponse.json();
                const controllers = await controllersResponse.json();
                const proxies = await proxiesResponse.json();

                document.getElementById('client-count').textContent = controllers.length || 0;
                document.getElementById('proxy-count').textContent = proxies.length || 0;
                document.getElementById('visitor-count').textContent = metrics.total_connections || 0;
                const clientsTable = document.getElementById('clients-table').querySelector('tbody');

                if (controllers.length === 0) {
                    clientsTable.innerHTML = '<tr><td colspan="4" class="empty-state"><p>等待客户端连接...</p></td></tr>';
                } else {
                    clientsTable.innerHTML = controllers.map(client => {
                            const connectedSeconds = client.connected_at || 0;
                            const connectedStr = connectedSeconds < 60 ? `${connectedSeconds}秒` :
                                               connectedSeconds < 3600 ? `${Math.floor(connectedSeconds/60)}分钟` :
                                               `${Math.floor(connectedSeconds/3600)}小时`;
                            return `
                        <tr>
                            <td style="font-family: 'Fira Code', monospace;">${client.client_id || '-'}</td>
                            <td style="font-family: 'Fira Code', monospace;">${client.run_id || '-'}</td>
                            <td style="color: #60A5FA;">已连接 ${connectedStr}</td>
                            <td><span style="color: #22C55E;">${client.last_heartbeat || 0}秒前</span></td>
                        </tr>
                    `;
                        }).join('');
                }

                const proxiesTable = document.getElementById('proxies-table').querySelector('tbody');

                if (proxies.length === 0) {
                    proxiesTable.innerHTML = '<tr><td colspan="5" class="empty-state"><p>暂无配置的代理</p></td></tr>';
                } else {
                    proxiesTable.innerHTML = proxies.map(proxy => `
                        <tr>
                            <td style="font-weight: 600;">${proxy.name}</td>
                            <td><span class="type-badge type-${proxy.type.toLowerCase()}">${proxy.type}</span></td>
                            <td style="font-family: 'Fira Code', monospace;">${proxy.local_ip}:${proxy.local_port}</td>
                            <td style="font-family: 'Fira Code', monospace;">${proxy.remote_port || '-'}</td>
                            <td style="font-family: 'Fira Code', monospace;">${proxy.client || '-'}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        fetchData();
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
